name: Publish Website to GitHub Pages
on:
    push:
        branches:
            - development

    # Trigger the workflow from the Actions UI.
    workflow_dispatch:

    # Trigger a docs deployment from another repository or automation.
    repository_dispatch:
        types:
            - docs-deploy

# Keep only the latest deployment request for this workflow.
concurrency:
    group: page-deploy
    cancel-in-progress: true

jobs:
    build:
        permissions:
            contents: read
            pages: write
            id-token: write
        if: github.repository_owner == 'synodic'
        uses: synodic/.github/.github/workflows/python-deploy-docs.yml@stable
